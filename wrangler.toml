# Instanz "privat" für Andrei und Sven. Eine weitere Instanz (z. B. SOMA Massagen) bekommt
# einen eigenen Abschnitt [env.<name>] mit eigenem Worker, eigener D1 und eigenem R2-Bucket,
# siehe docs/einrichtung.md.
name = "dokumente"
main = "src/index.js"
compatibility_date = "2026-06-01"
# Im Dashboard gesetzte Variablen (ACCESS_TEAM_DOMAIN, ACCESS_AUD) beim Veröffentlichen nicht löschen.
keep_vars = true
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/authorize", "/oauth/*", "/.well-known/*"]

[[d1_databases]]
binding = "DB"
database_name = "dokumente"
database_id = "8cce0d44-bceb-414c-acee-6c57cfaf33e3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DATEIEN"
bucket_name = "dokumente"
jurisdiction = "eu"

# Speicher der OAuth-Bibliothek (Clients, Freigaben, Token als Hash) für den claude.ai-Connector.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "15d396abb3bd4dbd8eb902d468b1ad15"

[vars.KONFIG]
name = "Dokumente"
bereiche = [
  { id = "andrei", name = "Andrei" },
  { id = "sven", name = "Sven" },
  { id = "gemeinsam", name = "Gemeinsam" },
]
personen = [
  { id = "andrei", name = "Andrei", bereiche = ["andrei", "gemeinsam"] },
  { id = "sven", name = "Sven", bereiche = ["sven", "gemeinsam"] },
]
# Andrei und Sven teilen sich ein Claude-Konto. Der Connector verbindet sich deshalb als
# gemeinsamer Zugang mit allen Bereichen, freigeben darf ihn jeder der beiden.
claude = { name = "Claude (gemeinsam)", bereiche = ["andrei", "sven", "gemeinsam"], freigeben = ["andrei", "sven"] }

